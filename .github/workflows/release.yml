name: Build e Release Multiplataforma

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: gitstore.exe
            asset_name: rrs-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: gitstore
            asset_name: rrs-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: gitstore
            asset_name: rrs-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: gitstore
            asset_name: rrs-macos-x86_64.tar.gz

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar Dependências de Compilação (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libasound2-dev libudev-dev libsecret-1-dev

      - name: Compilar Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacotar Artefato (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/gitstore.exe"
          Copy-Item $bin -Destination "RRS - Riva Rust Store.exe"
          Copy-Item $bin -Destination "rrs.exe"
          Compress-Archive -Path "RRS - Riva Rust Store.exe", "rrs.exe", "catalog.json", "README.md", "LICENSE" -DestinationPath "${{ matrix.asset_name }}"

      - name: Empacotar Artefato (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/gitstore ./rrs
          tar -czvf ${{ matrix.asset_name }} rrs catalog.json README.md LICENSE

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
